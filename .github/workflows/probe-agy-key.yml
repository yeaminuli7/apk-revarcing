name: Probe agy with API key

on:
  push:
    paths:
      - '.github/workflows/probe-agy-key.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Run agy in key-only mode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          R=/tmp/report.txt
          set -x
          curl -sS -m 40 -o /tmp/m.json "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_arm64.json"
          URL=$(python3 -c "import json;print(json.load(open('/tmp/m.json'))['url'])")
          curl -sSL -m 900 -o /tmp/core.tar.gz "$URL"
          mkdir -p /tmp/ex && tar -xzf /tmp/core.tar.gz -C /tmp/ex
          A=/tmp/ex/antigravity
          chmod +x "$A"
          mkdir -p /tmp/g && cd /tmp/g && unzip -oq "$GITHUB_WORKSPACE/app/src/main/assets/antigravity-glibc.zip"
          LD=/tmp/g/glibc/lib/ld-linux-aarch64.so.1
          chmod +x "$LD"

          mkdir -p /tmp/home/.gemini/antigravity-cli
          cat > /tmp/home/.gemini/antigravity-cli/settings.json <<'EOF'
          { "modelProvider": "gemini", "permissions": { "allow": ["command(*)"] } }
          EOF

          run_agy() {
            env HOME=/tmp/home GEMINI_API_KEY="${GEMINI_API_KEY}" \
              "$LD" --library-path /tmp/g/glibc/lib "$A" "$@" 2>&1 | tail -40
          }

          {
            echo "=== key present: $([ -n "$GEMINI_API_KEY" ] && echo yes || echo NO) ==="
            echo "=== models list (key mode) ==="
            run_agy models
            echo "=== real prompt: write a file ==="
            mkdir -p /tmp/ws && cd /tmp/ws
            run_agy -p "Create a file hello.py that prints hello, then run it." --dangerously-skip-permissions --add-dir /tmp/ws
            echo "=== workspace contents ==="
            ls -la /tmp/ws
            echo "=== hello.py ==="
            cat /tmp/ws/hello.py 2>/dev/null
          } > "$R" 2>&1
          tail -50 "$R"

      - name: Commit report
        if: always()
        run: |
          mkdir -p docs
          cp /tmp/report.txt docs/agy-key-run.txt 2>/dev/null || echo "no report" > docs/agy-key-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/agy-key-run.txt
          git commit -m "chore: agy key-mode run [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
