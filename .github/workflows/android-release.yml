name: Build Antigravity APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK 36
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          SDKMGR="$(ls "${SDK}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          if [ -z "$SDKMGR" ]; then
            yes 2>/dev/null | "${SDK}/tools/bin/sdkmanager" --licenses > /dev/null || true
            SDKMGR="${SDK}/tools/bin/sdkmanager"
          fi
          echo "sdkmanager=$SDKMGR"
          yes 2>/dev/null | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secret"
            echo "$KEYSTORE_BASE64" | base64 -d > app/KuatoDev.jks
          else
            echo "No keystore secret found - generating a throwaway signing key for this build"
            keytool -genkeypair -v \
              -keystore app/KuatoDev.jks \
              -storepass antigravity \
              -keypass antigravity \
              -alias antigravity \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Antigravity, OU=Android, O=Antigravity, L=NA, S=NA, C=US" > /dev/null 2>&1
            echo "SIGNING_STORE_PASSWORD=antigravity" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=antigravity" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=antigravity" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-log.txt

      - name: Dump compile errors
        if: failure()
        run: |
          grep -E "^e: " build-log.txt | sed -E 's#file:///[^ ]*/app/src/#app/src/#' | sort -u > errors.txt || true
          cp build-log.txt full-build-log.txt || true
          echo "errors: $(wc -l < errors.txt)"

      - name: Commit diagnostics
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f errors.txt full-build-log.txt
          git commit -m "ci: diagnostics from run ${{ github.run_number }} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          VERSION=${VERSION:-1.0.0}
          find app/build/outputs/apk -name '*.apk' | while read -r apk; do
            case "$apk" in
              *release*) cp -v "$apk" "dist/Antigravity-${VERSION}-release.apk" ;;
              *debug*)   cp -v "$apk" "dist/Antigravity-${VERSION}-debug.apk" ;;
              *)         cp -v "$apk" dist/ ;;
            esac
          done || true
          for f in dist/*.apk; do
            [ -e "$f" ] || continue
            echo "== $f"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$f" | head -5 || true
            ls -lh "$f"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-APK-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Build result: ${{ job.status }}"
            echo
            if [ -f build-log.txt ]; then
              echo '<details><summary>Gradle error excerpts</summary>'
              echo
              echo '```'
              grep -iE "^(> Task|FAILURE|e: |What went wrong|Caused by|error:|Execution failed)" build-log.txt | tail -n 80
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-${GITHUB_RUN_NUMBER}"
          NOTES="Automated build of $(git rev-parse --short HEAD) from ${GITHUB_REF_NAME}."
          gh release create "$TAG" dist/*.apk \
            --title "Antigravity APK ${TAG}" \
            --notes "$NOTES" \
            --target "${GITHUB_SHA}" || {
              gh release upload "$TAG" dist/*.apk --clobber
            }
