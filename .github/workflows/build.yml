name: Build BalaSpeak APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[builtin]') }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Slim APK (~50 MB): app only, neural models downloaded on demand.
  # Published to dist/ on the branch and to the v3.3-slim release
  # (release + debug build, both signed with the committed stable key).
  # ---------------------------------------------------------------------------
  build:
    name: Slim APK (release + debug)
    if: ${{ !contains(github.event.head_commit.message, '[builtin]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" || true
          "$SM" "platforms;android-36.1" || "$SM" "platforms;android-36" || true
          "$SM" "build-tools;36.0.0" || true

      - name: Fetch sherpa-onnx AAR (48 MB, not on Maven)
        run: bash scripts/fetch_sherpa_onnx_aar.sh

      - name: Prepare signing key
        run: |
          set -e
          if [ -f keystore/balaspeak-release.p12 ]; then
            echo "✓ using committed release keystore (stable signature)"
            echo "STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$(cat keystore/password.txt)" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          else
            echo "committed keystore missing — generating a throwaway key"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -storepass balaspeak2026 -keypass balaspeak2026 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=BalaSpeak, OU=Mobile, O=BalaSpeak, L=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=balaspeak2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug

      - name: Build release APK (R8, minified)
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleRelease

      - name: Verify signatures (v1 + certificate)
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          for f in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/debug/app-debug.apk; do
            echo "--- $f ---"
            if unzip -l "$f" | grep -qE 'META-INF/[^/]+\.(SF|RSA|EC)'; then
              echo "✓ v1 (JAR) signature present"
            else
              echo "✗ no v1 signature"; exit 1
            fi
            keytool -printcert -jarfile "$f" | grep -E 'Owner|Valid|SHA256:' | head -4 || true
          done

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist staging
          rm -f dist/*.apk || true
          cp app/build/outputs/apk/debug/app-debug.apk staging/BalaSpeak-v3.3-debug-arm64.apk
          cp app/build/outputs/apk/release/app-release.apk staging/BalaSpeak-v3.3-release-arm64.apk
          cp staging/BalaSpeak-v3.3-release-arm64.apk dist/
          ls -lh staging dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BalaSpeak-v3.3-apk
          path: staging/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish slim APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=v3.3-slim
          NOTES=/tmp/notes-slim.md
          cat > "$NOTES" <<'NOTES_EOF'
          Slim build: the app only. Neural voice packs are downloaded inside the app
          (Settings -> AI Voice Packs); nothing is bundled in the APK.

          Two assets, same signature, pick one:

          - `BalaSpeak-v3.3-release-arm64.apk` - 50 MB, R8-minified. **Use this one.**
          - `BalaSpeak-v3.3-debug-arm64.apk` - 70 MB, not minified. Use it if the release
            build misbehaves; it behaves identically but is slower and larger.

          **If installation fails:** uninstall any older BalaSpeak build first (previous
          versions used a different signing key), then install again. On Android 7 the
          installer needs the v1 signature - it is included in this build.
          NOTES_EOF
          sed -i 's/^          //' "$NOTES"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" staging/*.apk --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" staging/*.apk \
              --title "BalaSpeak v3.3 - slim APK (arm64)" --notes-file "$NOTES"
          fi

      - name: Publish APK to branch (dist/)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ci: BalaSpeak v3.3 arm64 APK [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # ---------------------------------------------------------------------------
  # Built-in-voices APK (~340 MB): every neural model inside, works with no
  # network, never falls back to the device TTS engine. Too large for git, so it
  # is published as a GitHub Release asset. Built WITHOUT R8 minification so the
  # character voices cannot be broken by shrinking.
  # ---------------------------------------------------------------------------
  builtin:
    name: Built-in voices APK (all languages, offline)
    if: ${{ contains(github.event.head_commit.message, '[builtin]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" || true
          "$SM" "platforms;android-36.1" || "$SM" "platforms;android-36" || true
          "$SM" "build-tools;36.0.0" || true

      - name: Fetch sherpa-onnx AAR (48 MB, not on Maven)
        run: bash scripts/fetch_sherpa_onnx_aar.sh

      - name: Unpack models into jniLibs (installer places them, app copies nothing)
        # Every model file becomes lib/arm64-v8a/libvNNNN.so plus one line in
        # assets/tts/libmap.tsv. With extractNativeLibs=true the PACKAGE MANAGER writes
        # all ~414 MB into /data/app/…/lib/arm64 during installation, so the first
        # launch only has to link them — no copy, no download, no unzip.
        run: bash scripts/prepare_builtin_assets.sh

      - name: Prepare signing key
        run: |
          set -e
          if [ -f keystore/balaspeak-release.p12 ]; then
            echo "✓ using committed release keystore (stable signature)"
            echo "STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$(cat keystore/password.txt)" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          else
            echo "committed keystore missing — generating a throwaway key"
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
              -storepass balaspeak2026 -keypass balaspeak2026 \
              -alias upload -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=BalaSpeak, OU=Mobile, O=BalaSpeak, L=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_TYPE=JKS" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=balaspeak2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          fi

      - name: Build release APK with bundled voices (no R8)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleRelease -PnoMinify

      - name: Verify voices and signature inside the APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          echo "APK size: $(stat -c %s "$APK") bytes"
          LIST=$(unzip -l "$APK")
          fail=0
          chk() { grep -qE "$1" <<< "$LIST" && echo "✓ $2" || { echo "✗ MISSING: $2"; fail=1; }; }
          # models ship as jniLibs so the *installer* extracts them at install time
          chk ' assets/tts/libmap\.tsv$'                       'lib manifest (lang/relpath/lib)'
          chk ' assets/tts/bn_vocab\.json$'                    'Bangla vocab'
          chk ' lib/arm64-v8a/libonnxruntime\.so$'             'ONNX Runtime'
          libs=$(grep -cE ' lib/arm64-v8a/libv[0-9]{4}\.so$' <<< "$LIST" || true)
          want=$(grep -c . app/src/main/assets/tts/libmap.tsv || true)
          echo "model libs in APK: $libs (manifest: $want)"
          [ "$libs" -gt 1000 ] || { echo "only $libs model libs — jniLibs packaging failed"; fail=1; }
          [ "$libs" -eq "$want" ] || { echo "manifest/APK mismatch: $want vs $libs"; fail=1; }
          if grep -q ' assets/tts/extracted/' <<< "$LIST"; then
            echo "✗ extracted tree still in assets — models must live in jniLibs only"; fail=1
          else
            echo "✓ assets carry no model bytes (the installer places them)"
          fi
          if grep -qE '\.tar\.bz2$' <<< "$LIST"; then
            echo "✗ .tar.bz2 archives are still inside the APK"; fail=1
          else
            echo "✓ no bzip2 archives inside the APK"
          fi
          [ "$fail" -eq 0 ] || { echo "Voice assets missing from APK"; exit 1; }
          bytes=$(stat -c %s "$APK")
          [ "$bytes" -gt 300000000 ] || { echo "APK is only $bytes bytes — models were not bundled"; exit 1; }
          if unzip -l "$APK" | grep -qE 'META-INF/[^/]+\.(SF|RSA|EC)'; then
            echo "✓ v1 (JAR) signature present"
          else
            echo "✗ no v1 signature"; exit 1
          fi
          keytool -printcert -jarfile "$APK" | grep -E 'Owner|Valid|SHA256:' | head -4

      - name: Stage release asset
        run: |
          set -e
          mkdir -p out dist
          cp app/build/outputs/apk/release/app-release.apk out/BalaSpeak-v3.3-builtin-allvoices-arm64.apk
          SIZE=$(stat -c %s out/BalaSpeak-v3.3-builtin-allvoices-arm64.apk)
          SHA=$(sha256sum out/BalaSpeak-v3.3-builtin-allvoices-arm64.apk | cut -d' ' -f1)
          {
            echo "BalaSpeak v3.3 — built-in voices (all languages)"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${GITHUB_SHA}"
            echo "asset:  BalaSpeak-v3.3-builtin-allvoices-arm64.apk"
            echo "size:   ${SIZE} bytes ($(numfmt --to=iec "$SIZE"))"
            echo "sha256: ${SHA}"
            echo "signed: v1 + v2 + v3, stable keystore (keystore/balaspeak-release.p12)"
            echo "built without R8 minification (character voices stay intact)"
            echo "abi:    arm64-v8a (minSdk 24, targetSdk 36, versionCode 24)"
            echo "voices: English 31 characters (ages + monster/robot/ghost/...), Bangla 6, Hindi 6"
            echo "layout: models ship as jniLibs — the package manager places them at INSTALL time"
            echo "        first launch only creates links (~0.1 s): nothing downloaded, nothing copied"
            echo
            echo "model libs: $(unzip -l out/BalaSpeak-v3.3-builtin-allvoices-arm64.apk | grep -cE ' lib/arm64-v8a/libv[0-9]{4}\.so')"
            echo "largest model libs:"
            unzip -l out/BalaSpeak-v3.3-builtin-allvoices-arm64.apk | grep -E ' lib/arm64-v8a/libv[0-9]{4}\.so' \
              | sort -rn | head -8 | awk '{printf "  %10s  %s\n", $1, $4}'
          } > dist/BUILTIN-INFO.txt
          cat dist/BUILTIN-INFO.txt

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v3.3-builtin"
          ASSET=out/BalaSpeak-v3.3-builtin-allvoices-arm64.apk
          cat > /tmp/notes.md <<'NOTES_EOF'
          Fully offline build: every neural voice model is inside the APK. Nothing is
          downloaded on first run, and the Android system TTS engine is never used.

          **Install:** download `BalaSpeak-v3.3-builtin-allvoices-arm64.apk`, copy it to the
          phone, tap it, allow install from unknown sources. Requires Android 7.0+ (arm64)
          and about 1 GB free storage (the APK plus the space its models occupy).
          Nothing runs on first launch: the models travel as native libraries, so the
          Android installer places every file itself and the app only creates links
          (a fraction of a second). No download, no unzip, no "preparing voices" wait.

          **Upgrading from v2.7:** v2.7 builds were signed with a throwaway key, so uninstall
          the old app first. From v3.3 on, the signature is stable and updates install over
          each other.

          **English voices:** 31 characters — baby, toddler, child, teen, young adult,
          middle-aged, grandparent, plus narrator, hero, villain, monster, demon, giant,
          vampire, robot, alien, ghost, whisper, witch and chipmunk (real Kokoro speakers
          with pitch/speed shaping and DSP timbre).

          **API keys:** subtitle translation and transcription still need a Gemini key
          (and optionally Groq) entered in Settings. No key is baked into the APK.
          NOTES_EOF
          sed -i 's/^          //' /tmp/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — replacing asset"
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "$ASSET" \
              --title "BalaSpeak v3.3 — built-in voices + 31 English characters" \
              --notes-file /tmp/notes.md
          fi
          gh release view "$TAG" --json tagName,assets

      - name: Record build info on the branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/BUILTIN-INFO.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ci: built-in voices APK build info [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
