name: Build BalaSpeak APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[builtin]') }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Slim APK (~50 MB): app only, neural voice models are downloaded on demand.
  # Published to dist/ on the branch.
  # ---------------------------------------------------------------------------
  build:
    name: Slim APK (models downloaded on demand)
    if: ${{ !contains(github.event.head_commit.message, '[builtin]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" || true
          "$SM" "platforms;android-36.1" || "$SM" "platforms;android-36" || true
          "$SM" "build-tools;36.0.0" || true

      - name: Fetch sherpa-onnx AAR (48 MB, not on Maven)
        run: bash scripts/fetch_sherpa_onnx_aar.sh

      - name: Generate signing keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -storepass "${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}" \
            -keypass  "${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=BalaSpeak, OU=Mobile, O=BalaSpeak, L=Dhaka, C=BD"

      - name: Build debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
          KEY_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug

      - name: Build release APK (R8, minified)
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
          KEY_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist staging
          rm -f dist/*.apk || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk staging/BalaSpeak-v2.7-debug-arm64.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk staging/BalaSpeak-v2.7-release-arm64.apk
          fi
          if [ -f staging/BalaSpeak-v2.7-release-arm64.apk ]; then
            cp staging/BalaSpeak-v2.7-release-arm64.apk dist/
          else
            cp staging/BalaSpeak-v2.7-debug-arm64.apk dist/
          fi
          ls -lh staging dist
          test -n "$(ls -A dist)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BalaSpeak-v2.7-apk
          path: staging/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish APK to branch (dist/)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ci: BalaSpeak v2.7 arm64 APK [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # ---------------------------------------------------------------------------
  # Built-in-voices APK (~340 MB): all neural models inside the APK, works with
  # no network, never falls back to the device TTS engine. Too large for git, so
  # it is published as a GitHub Release asset.
  # ---------------------------------------------------------------------------
  builtin:
    name: Built-in voices APK (all languages, offline)
    if: ${{ contains(github.event.head_commit.message, '[builtin]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platform-tools" || true
          "$SM" "platforms;android-36.1" || "$SM" "platforms;android-36" || true
          "$SM" "build-tools;36.0.0" || true

      - name: Fetch sherpa-onnx AAR (48 MB, not on Maven)
        run: bash scripts/fetch_sherpa_onnx_aar.sh

      - name: Bundle neural voice models into assets (294 MB)
        run: bash scripts/fetch_builtin_voices.sh

      - name: Generate signing keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -storepass "${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}" \
            -keypass  "${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=BalaSpeak, OU=Mobile, O=BalaSpeak, L=Dhaka, C=BD"

      - name: Build release APK with bundled voices
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
          KEY_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
        run: |
          chmod +x gradlew
          # -PnoShrink: keep resource shrinking off so nothing can touch assets/tts
          ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleRelease -PnoShrink

      - name: Verify voice assets are inside the APK
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          echo "APK size: $(stat -c %s "$APK") bytes"
          LIST=$(unzip -l "$APK")
          fail=0
          for f in assets/tts/bn/model.onnx \
                   assets/tts/hi/pratham/vits-piper-hi_IN-pratham-medium-int8.tar.bz2 \
                   assets/tts/hi/rohan/vits-piper-hi_IN-rohan-medium-int8.tar.bz2 \
                   assets/tts/hi/priyamvada/vits-piper-hi_IN-priyamvada-medium-int8.tar.bz2 \
                   assets/tts/en/kokoro-int8-multi-lang-v1_0.tar.bz2; do
            if grep -q " $f$" <<< "$LIST"; then
              echo "✓ bundled: $f"
            else
              echo "✗ MISSING: $f"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "Voice assets missing from APK"; exit 1; }
          # No stale download-only build: assets must account for most of the APK.
          bytes=$(stat -c %s "$APK")
          [ "$bytes" -gt 300000000 ] || { echo "APK is only $bytes bytes — models were not bundled"; exit 1; }

      - name: Stage release asset
        run: |
          set -e
          mkdir -p out dist
          cp app/build/outputs/apk/release/app-release.apk out/BalaSpeak-v2.7-builtin-allvoices-arm64.apk
          SIZE=$(stat -c %s out/BalaSpeak-v2.7-builtin-allvoices-arm64.apk)
          SHA=$(sha256sum out/BalaSpeak-v2.7-builtin-allvoices-arm64.apk | cut -d' ' -f1)
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          {
            echo "BalaSpeak v2.7 — built-in voices (all languages)"
            echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${GITHUB_SHA}"
            echo "asset:  BalaSpeak-v2.7-builtin-allvoices-arm64.apk"
            echo "size:   ${SIZE} bytes ($(numfmt --to=iec "$SIZE"))"
            echo "sha256: ${SHA}"
            echo "abi:    arm64-v8a (minSdk 24, targetSdk 36)"
            echo "models: Bangla MMS-TTS 114 MB · Hindi Piper x3 60 MB · English Kokoro v1.0 132 MB"
            echo "engine: neural only — the device TTS engine is never used"
            echo
            echo "bundled assets:"
            unzip -l out/BalaSpeak-v2.7-builtin-allvoices-arm64.apk | grep ' assets/tts/' | awk '{printf "  %10s  %s\n", $1, $4}'
          } > dist/BUILTIN-INFO.txt
          cat dist/BUILTIN-INFO.txt

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="v2.7-builtin"
          ASSET=out/BalaSpeak-v2.7-builtin-allvoices-arm64.apk
          cat > /tmp/release-notes.md <<'NOTES'
          Fully offline build: every neural voice model is inside the APK. Nothing is
          downloaded on first run, and the Android system TTS engine is never used.

          **Install:** download `BalaSpeak-v2.7-builtin-allvoices-arm64.apk`, copy it to the
          phone, tap it and allow install from unknown sources.
          Requires Android 7.0+ (arm64) and about 700 MB of free storage
          (the APK plus its one-time unpack of the models).

          **First launch:** the app unpacks the bundled voices into internal storage
          (30-60 s). After that it works with no internet at all — voices included.

          **API keys:** subtitle translation and transcription still need a Gemini key
          (and optionally Groq) entered in Settings. No key is baked into the APK.

          Bundled voices: Bangla (MMS-TTS, 6 personas) · Hindi (3 Piper speakers) ·
          English (Kokoro v1.0, 53 speakers, af_heart).
          NOTES
          sed -i 's/^          //' /tmp/release-notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — replacing asset"
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$ASSET" \
              --title "BalaSpeak v2.7 — built-in voices (Bangla · Hindi · English)" \
              --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG" --json tagName,assets

      - name: Record build info on the branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/BUILTIN-INFO.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ci: built-in voices APK build info [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
