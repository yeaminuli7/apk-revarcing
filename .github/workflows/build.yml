name: Build BalaSpeak APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          # compileSdk 36.1 (Android 16 QPR) + build tools for AGP 9
          "$SM" "platform-tools" || true
          "$SM" "platforms;android-36.1" || "$SM" "platforms;android-36" || true
          "$SM" "build-tools;36.0.0" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Fetch sherpa-onnx AAR (48 MB, not on Maven)
        run: bash scripts/fetch_sherpa_onnx_aar.sh

      - name: Generate signing keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -storepass "${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}" \
            -keypass  "${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=BalaSpeak, OU=Mobile, O=BalaSpeak, L=Dhaka, C=BD"

      - name: Build debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
          KEY_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug

      - name: Build release APK (R8, minified)
        id: release_build
        continue-on-error: true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
          KEY_PASSWORD: ${{ secrets.APK_STORE_PASSWORD || 'balaspeak2026' }}
        run: |
          ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleRelease

      - name: Collect APKs
        run: |
          set -e
          mkdir -p dist staging
          rm -f dist/*.apk || true
          ls -l app/build/outputs/apk/debug/ || true
          ls -l app/build/outputs/apk/release/ || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk staging/BalaSpeak-v2.7-debug-arm64.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk staging/BalaSpeak-v2.7-release-arm64.apk
          fi
          # Keep the published dist/ folder to a single (re)installable APK:
          # the signed release build, or the debug build if release failed.
          if [ -f staging/BalaSpeak-v2.7-release-arm64.apk ]; then
            cp staging/BalaSpeak-v2.7-release-arm64.apk dist/
          else
            cp staging/BalaSpeak-v2.7-debug-arm64.apk dist/
          fi
          ls -lh staging dist
          test -n "$(ls -A dist)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BalaSpeak-v2.7-apk
          path: staging/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish APKs to branch (dist/)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -lh dist
          git add -f dist
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "ci: BalaSpeak v2.7 arm64 APK [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
