name: Probe bootstrap layout

on:
  push:
    paths:
      - '.github/workflows/probe-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect bootstrap archive
        run: |
          set -x
          mkdir -p /tmp/b && cd /tmp/b
          curl -sSL --retry 3 -o bootstrap.zip \
            "https://github.com/KuatoDev/antigravity-bootstrap/releases/download/core-v1/bootstrap-aarch64.zip"
          ls -l bootstrap.zip
          sha256sum bootstrap.zip

          unzip -l bootstrap.zip | head -40 > /tmp/report.txt
          echo "=== total entries ===" >> /tmp/report.txt
          unzip -l bootstrap.zip | tail -2 >> /tmp/report.txt

          echo "=== engine/ entries ===" >> /tmp/report.txt
          unzip -l bootstrap.zip | grep -E "engine/" >> /tmp/report.txt || echo "NONE" >> /tmp/report.txt

          echo "=== agy / language_server entries ===" >> /tmp/report.txt
          unzip -l bootstrap.zip | grep -E "agy|language_server" >> /tmp/report.txt || echo "NONE" >> /tmp/report.txt

          unzip -q -o bootstrap.zip -d root || true
          echo "=== root tree (depth 2) ===" >> /tmp/report.txt
          find root -maxdepth 2 | head -60 >> /tmp/report.txt

          for f in $(find root -name agy -o -name language_server | head -5); do
            echo "=== $f ===" >> /tmp/report.txt
            file "$f" >> /tmp/report.txt 2>&1
            ls -l "$f" >> /tmp/report.txt
            readelf -l "$f" 2>/dev/null | grep -A1 INTERP >> /tmp/report.txt || echo "no INTERP" >> /tmp/report.txt
            readelf -d "$f" 2>/dev/null | head -20 >> /tmp/report.txt || true
            echo "--- needed libs ---" >> /tmp/report.txt
            readelf -d "$f" 2>/dev/null | grep NEEDED >> /tmp/report.txt || true
          done

          echo "=== ld / glibc in archive ===" >> /tmp/report.txt
          find root -name "ld-linux*" -o -name "libc.so*" | head -10 >> /tmp/report.txt

          cat /tmp/report.txt

      - name: Commit report
        if: always()
        run: |
          mkdir -p docs
          cp /tmp/report.txt docs/bootstrap-report.txt 2>/dev/null || echo "no report" > docs/bootstrap-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/bootstrap-report.txt
          git commit -m "chore: bootstrap archive report [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
