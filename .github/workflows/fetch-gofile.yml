name: Fetch source from gofile

on:
  push:
    paths:
      - '.github/workflows/fetch-gofile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from gofile
        id: dl
        continue-on-error: true
        run: |
          mkdir -p incoming
          exec > >(tee -a incoming/debug.log) 2>&1
          set -x

          echo "== servers"
          curl -sS "https://api.gofile.io/servers" -o /tmp/servers.json || true
          cat /tmp/servers.json; echo

          SERVER=$(jq -r '.data.servers[0].name // empty' /tmp/servers.json)
          echo "SERVER=$SERVER"

          echo "== guest token"
          curl -sS -X POST "https://api.gofile.io/accounts" -H 'Content-Type: application/json' -d '{}' -o /tmp/acct.json || true
          cat /tmp/acct.json; echo
          TOKEN=$(jq -r '.data.token // empty' /tmp/acct.json)

          echo "== contents"
          if [ -n "$TOKEN" ]; then
            curl -sS -H "Authorization: Bearer $TOKEN" "https://api.gofile.io/contents/Z0nbSQmP?cache=true" -o /tmp/contents.json || true
          else
            curl -sS "https://api.gofile.io/contents/Z0nbSQmP?cache=true" -o /tmp/contents.json || true
          fi
          cat /tmp/contents.json; echo

          ID=$(jq -r '(.data.children // {}) | to_entries[0].value.id // empty' /tmp/contents.json)
          NAME=$(jq -r '(.data.children // {}) | to_entries[0].value.name // empty' /tmp/contents.json)
          LINK=$(jq -r '(.data.children // {}) | to_entries[0].value.link // empty' /tmp/contents.json)
          echo "ID=$ID NAME=$NAME LINK=$LINK"

          if [ -z "$LINK" ] && [ -n "$ID" ] && [ -n "$TOKEN" ] && [ -n "$SERVER" ]; then
            curl -sS -H "Authorization: Bearer $TOKEN" "https://${SERVER}.gofile.io/getContent?contentId=${ID}&token=${TOKEN}&websiteToken=12345" -o /tmp/c2.json || true
            cat /tmp/c2.json; echo
            LINK=$(jq -r '(.data.children // {}) | to_entries[0].value.link // .data.file // empty' /tmp/c2.json)
          fi

          if [ -z "$LINK" ]; then echo "NO_LINK"; exit 1; fi
          curl -L --fail --retry 3 -o "incoming/$NAME" "$LINK"
          ls -lh incoming/
          file "incoming/$NAME"

          echo "== extracting"
          mkdir -p incoming/extracted
          unzip -q -o "incoming/$NAME" -d incoming/extracted || tar -xf "incoming/$NAME" -C incoming/extracted
          find incoming/extracted -maxdepth 4 | head -300 > incoming/_tree.txt
          cat incoming/_tree.txt

      - name: Commit downloaded source
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -laR incoming | head -100
          git add -A incoming
          git diff --cached --quiet || git commit -m "chore: import Antigravity_Modified source from gofile"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
