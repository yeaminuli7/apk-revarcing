name: Fetch source from gofile

on:
  push:
    paths:
      - '.github/workflows/fetch-gofile.yml'
      - 'tools/gofile-fetch.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Browser download
        run: |
          mkdir -p incoming
          node tools/gofile-fetch.mjs 2>&1 | tee -a incoming/console.txt
          echo "exit=$?" | tee -a incoming/console.txt

      - name: Commit downloaded source
        if: always()
        run: |
          rm -rf node_modules package.json package-lock.json .npm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find incoming -maxdepth 3 | head -100
          git add -A incoming
          git diff --cached --quiet || git commit -m "chore: import Antigravity_Modified source from gofile"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
