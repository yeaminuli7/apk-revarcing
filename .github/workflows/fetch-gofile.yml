name: Fetch source from gofile

on:
  push:
    paths:
      - '.github/workflows/fetch-gofile.yml'
      - 'tools/gofile-fetch.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i --no-audit --no-fund playwright-core@1.49.1
          npx playwright-core install --with-deps chrome || npx playwright-core install --with-deps chromium

      - name: Download from gofile via browser
        continue-on-error: true
        run: node tools/gofile-fetch.mjs || true

      - name: Extract archive
        continue-on-error: true
        run: |
          cd incoming
          for f in *; do
            case "$f" in *.log|*.json|*.txt) continue;; esac
            mkdir -p extracted
            unzip -q -o "$f" -d extracted || tar -xf "$f" -C extracted || cp "$f" extracted/
          done
          find extracted -maxdepth 4 | head -300 | tee _tree.txt

      - name: Commit downloaded source
        if: always()
        run: |
          rm -rf node_modules package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -laR incoming | head -120
          git add -A incoming
          git diff --cached --quiet || git commit -m "chore: import Antigravity_Modified source from gofile"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
