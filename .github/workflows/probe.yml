name: Probe build
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Probe
        run: |
          set +e
          chmod +x gradlew
          mkdir -p .probe
          ./gradlew --version > .probe/version.txt 2>&1
          echo "version exit=$?"
          echo "### gradle" >> .probe/report.md
          tail -20 .probe/version.txt >> .probe/report.md
          ./gradlew :app:assembleDebug --stacktrace > .probe/build.txt 2>&1
          echo "build exit=$?"
          echo "### build excerpt" >> .probe/report.md
          grep -iE "^(e: |> Task|FAILURE|What went wrong|Caused by|error:|Could not|BUILD)" .probe/build.txt | tail -60 >> .probe/report.md
          tail -40 .probe/build.txt >> .probe/report.md
      - name: Save report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .probe
          git commit -m "probe report [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
