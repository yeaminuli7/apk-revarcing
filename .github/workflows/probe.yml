name: Probe build
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: |
          chmod +x gradlew
          keytool -genkeypair -v -keystore app/KuatoDev.jks -storepass antigravity -keypass antigravity \
            -alias antigravity -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=A, OU=A, O=A, L=NA, S=NA, C=US" > /dev/null 2>&1
          export SIGNING_STORE_PASSWORD=antigravity SIGNING_KEY_ALIAS=antigravity SIGNING_KEY_PASSWORD=antigravity
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace > build-out.txt 2>&1
          echo "exit=$?"
          grep -c "attribute android:feedbackType" build-out.txt > /tmp/fcount || true
          echo "feedbackType mentions: $(cat /tmp/fcount)"
          ls -la app/build/outputs/apk/debug app/build/outputs/apk/release 2>/dev/null || true
      - name: Report via commit message
        if: always()
        run: |
          git config user.name "probe-bot"
          git config user.email "probe@example.com"
          EXCERPT=$(grep -iE "error:|error |What went wrong|Caused by:|FAILURE:|Execution failed|^e: " build-out.txt | head -n 40 | cut -c1-250)
          cp build-out.txt .probe-full-log.txt
          grep -E "^e: " build-out.txt | sed -E 's#file:///[^ ]*/app/src/#app/src/#' | sort -u > errors.txt
          echo "errors: $(wc -l < errors.txt)"
          {
            echo "probe-report"
            echo
            echo '```'
            echo "$EXCERPT"
            echo '```'
            echo
            echo "full errors: $(wc -l < errors.txt)"
          } > .probe-report.md
          git add -f .probe-report.md errors.txt
          git commit -m "probe: build output excerpt" -q
          git push origin "HEAD:${GITHUB_REF_NAME}" -q
