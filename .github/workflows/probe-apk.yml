name: Inspect APK payload

on:
  push:
    paths:
      - '.github/workflows/probe-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$TAG" --pattern "*.apk" --dir /tmp/apk
          A=$(ls /tmp/apk/*.apk | head -1)
          {
            echo "tag=$TAG"
            ls -lh "$A"
            echo "=== bundled payload entries ==="
            unzip -lv "$A" | awk 'NR<3 || /assets\/(bootstrap|core_|core-|antigravity-glibc)/'
            echo "=== integrity of the engine payload inside the apk ==="
            unzip -p "$A" assets/core_engine_payload > /tmp/payload.tar.gz
            ls -l /tmp/payload.tar.gz
            sha512sum /tmp/payload.tar.gz
            echo "declared:"; cat app/src/main/assets/core-engine.txt 2>/dev/null || true
            echo "=== gzip test + member list ==="
            gzip -t /tmp/payload.tar.gz && echo "gzip OK"
            tar -tzf /tmp/payload.tar.gz
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt

      - name: Commit report
        if: always()
        run: |
          mkdir -p docs
          cp /tmp/report.txt docs/apk-report.txt 2>/dev/null || echo "no report" > docs/apk-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/apk-report.txt
          git commit -m "chore: apk payload report [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
