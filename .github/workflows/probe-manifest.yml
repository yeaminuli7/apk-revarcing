name: Probe core manifest

on:
  push:
    paths:
      - '.github/workflows/probe-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query core engine manifest
        run: |
          set -x
          M="https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_arm64.json"
          {
            echo "=== manifest HTTP ==="
            curl -sS -m 40 -o /tmp/m.json -w "code=%{http_code} size=%{size_download}\n" "$M" || echo "curl failed: $?"
            echo "=== manifest body ==="
            cat /tmp/m.json 2>/dev/null | head -c 2000
            echo
            URL=$(python3 -c "import json;print(json.load(open('/tmp/m.json'))['url'])" 2>/dev/null)
            echo "=== url: $URL ==="
            if [ -n "$URL" ]; then
              curl -sSIL -m 40 "$URL" 2>&1 | grep -Ei "^(HTTP/|content-length|location)" | head -10
            fi
          } > /tmp/report.txt 2>&1
          cat /tmp/report.txt

      - name: Commit report
        if: always()
        run: |
          mkdir -p docs
          cp /tmp/report.txt docs/manifest-report.txt 2>/dev/null || echo "no report" > docs/manifest-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/manifest-report.txt
          git commit -m "chore: core manifest report [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
